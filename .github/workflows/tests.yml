name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  integration:
    # Real WordPress + MariaDB in Docker; no Claude call, no secrets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: docker compose -p wpai up -d --wait
      - run: ./scripts/setup_local_wp.sh
      - run: WP_INTEGRATION=1 pytest -m integration -v
      - if: failure()
        run: docker compose -p wpai logs --tail 100
